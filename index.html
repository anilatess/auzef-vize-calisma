const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pw){const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:250000,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},k,u(D.c));
const html=await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(html);document.close();}
async function tryPw(pw,remember){try{await open(pw);if(remember)try{localStorage.setItem('auzef-pw',pw)}catch(e){}return true}catch(e){return false}}
(async()=>{let s=null;try{s=localStorage.getItem('auzef-pw')}catch(e){} if(s&&await tryPw(s,false))return;})();
document.getElementById('f').onsubmit=async e=>{e.preventDefault();const ok=await tryPw(document.getElementById('pw').value,true);if(!ok)document.getElementById('err').textContent='Şifre yanlış.';};
</script></body></html>
